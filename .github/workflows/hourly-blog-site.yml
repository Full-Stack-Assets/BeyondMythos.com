name: Hourly blog site generation

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-blog-site-candidate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-site-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Baseline tests
        run: npm test

      - name: Generate blog-site candidate without deployment credentials
  generate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate new blog site into the Pages tree
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTENT_PROVIDER: ${{ vars.CONTENT_PROVIDER }}
          BEYONDMYTHOS_URL: https://beyondmythos.com
        run: node scripts/generate-blog-site.js
      - name: Commit and push generated site
        run: |
          set -euo pipefail
          git config user.name "beyondmythos-bot"
          git config user.email "bot@beyondmythos.dev"
          git pull --rebase origin main || true
          git add data/ public/sites/
          if git diff --cached --quiet; then
            echo "No new site candidate generated."
            exit 0
          fi
          git commit -m "blog: generate new site $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
          echo "Pushed generated site; GitHub Pages deployment will follow the main-branch push."
