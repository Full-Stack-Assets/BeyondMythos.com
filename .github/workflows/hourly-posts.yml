name: Hourly posts for all sites

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Add one new post to every site
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTENT_PROVIDER: ${{ vars.CONTENT_PROVIDER }}
          BEYONDMYTHOS_URL: ${{ secrets.BEYONDMYTHOS_URL || secrets.STOREFORGE_URL }}
          STOREFORGE_URL: ${{ secrets.STOREFORGE_URL }}
        run: node scripts/add-posts.js

      - name: Validate generated candidate
        run: npm test

      - name: Commit candidate changes to automation branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "beyondmythos-bot"
          git config user.email "bot@beyondmythos.dev"

          candidate_branch="automation/content-candidates"
          git fetch origin "${candidate_branch}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${candidate_branch}"; then
            git checkout -B "${candidate_branch}" "origin/${candidate_branch}"
            git merge --no-edit "${GITHUB_SHA}"
          else
            git checkout -B "${candidate_branch}" "${GITHUB_SHA}"
          fi

          git add data/ public/sites/
          if git diff --cached --quiet; then
            echo "No new posts to commit."
            exit 0
          fi

          git commit -m "content: candidate batch $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force-with-lease origin "HEAD:${candidate_branch}"

          echo "Candidate batch pushed to ${candidate_branch}."
          echo "Production deployment requires a reviewed pull request into main."
