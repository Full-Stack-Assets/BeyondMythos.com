name: Hourly posts for all sites

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Add one new post to every generated site
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTENT_PROVIDER: ${{ vars.CONTENT_PROVIDER }}
          BEYONDMYTHOS_URL: https://beyondmythos.com
        run: node scripts/add-posts.js
      - name: Commit and push generated posts
        run: |
          set -euo pipefail
          git config user.name "beyondmythos-bot"
          git config user.email "bot@beyondmythos.dev"
          git pull --rebase origin main || true
          git add data/ public/sites/
          if git diff --cached --quiet; then
            echo "No new posts to commit."
            exit 0
          fi
          git commit -m "blog: hourly posts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
          echo "Pushed generated posts; GitHub Pages deployment will follow the main-branch push."
